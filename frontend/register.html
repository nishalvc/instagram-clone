<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Instagram Register</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

  <div class="login-box">

    <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQAEGdv2F9ST9i_w1JjDqWvhi5wNx_zkfKfgSdbhH_Rbg&s=10" alt="Instagram Logo">

    <form id="registerForm">

      <input
        type="text"
        id="username"
        placeholder="Username"
        required
      >

      <br><br>

      <input
        type="password"
        id="password"
        placeholder="Password"
        required
      >

      <br><br>

      <button type="submit">
        Sign Up
      </button>

    </form>

    <div class="divider">
      <span>OR</span>
    </div>

    <a href="index.html" class="forgot">
      Already have an account? Login
    </a>

  </div>

</div>

<script src="register.js"></script>

</body>
</html>
